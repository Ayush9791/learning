<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c10"><title>LearnTrack</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>"><style>
:root{--bg:#090a0e;--panel:#101218;--panel2:#151720;--line:#252832;--text:#f5f7fb;--muted:#9499a8;--accent:#8b5cf6;--accent2:#a78bfa;--good:#34d399;--danger:#fb7185;--shadow:0 20px 60px #0008}*{box-sizing:border-box}html[data-theme=light]{--bg:#f5f6fa;--panel:#fff;--panel2:#f0f1f6;--line:#dddfe7;--text:#171922;--muted:#687080;--shadow:0 20px 60px #3332}body{margin:0;background:radial-gradient(circle at 80% -10%,#5b21b633,transparent 35%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;display:flex}.side{width:245px;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;background:#0b0c10ee;backdrop-filter:blur(20px);z-index:4}.brand{display:flex;align-items:center;gap:11px;margin:0 8px 34px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4f46e5);display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:16px}.brand small{color:var(--muted)}.nav{width:100%;border:0;background:transparent;color:var(--muted);display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:10px;margin:2px 0;text-align:left}.nav:hover,.nav.active{background:var(--panel2);color:var(--text)}.sideBottom{margin-top:auto}.streakMini{margin:18px 5px 4px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.streakMini b{color:#f59e0b}.main{margin-left:245px;width:calc(100% - 245px);max-width:1400px;padding:36px 42px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}.eyebrow{letter-spacing:.12em;font-size:11px;font-weight:800;color:var(--accent2);margin:0 0 6px}.top h1{font-size:30px;letter-spacing:-.03em;margin:0}.actions{display:flex;gap:9px}.icon,.primary,.secondary,.danger,.search{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px}.icon{width:40px;height:40px;display:grid;place-items:center}.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:10px 14px;font-weight:750;display:inline-flex;align-items:center;gap:7px}.secondary{padding:10px 13px;display:inline-flex;align-items:center;gap:7px}.danger{color:var(--danger);padding:9px 12px;display:inline-flex;align-items:center;gap:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}.stat{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;align-items:center;gap:13px}.statIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#7c3aed22;color:var(--accent2)}.statIcon.hot{color:#f59e0b;background:#f59e0b18}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.stat strong{font-size:21px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:0 0 16px}.sectionHead h2{margin:0;font-size:19px}.sectionHead p{margin:4px 0 0;color:var(--muted)}.search{padding:10px 13px;min-width:210px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:17px;text-align:left;color:var(--text);transition:.18s;box-shadow:0 4px 18px #0002}.card:hover{transform:translateY(-2px);border-color:#6b728055}.cardTop{display:flex;gap:11px;align-items:center}.cover{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff}.title{flex:1}.title b{display:block;font-size:15px}.title span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.pill{font-size:10px;letter-spacing:.08em;padding:4px 7px;border-radius:999px;background:#34d39918;color:var(--good)}.progressRow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:20px 0 7px}.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;border-radius:99px}.bottom{display:flex;justify-content:space-between;margin-top:15px;color:var(--muted);font-size:12px}.bottom span{display:flex;align-items:center;gap:5px}.addCard{min-height:190px;border:1px dashed #5b6070;background:transparent;border-radius:16px;color:var(--muted);display:grid;place-content:center;text-align:center;gap:8px}.addCard strong{color:var(--text)}.overlay{position:fixed;z-index:10;inset:0;background:#000b;display:grid;place-items:center;padding:22px}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:25px;position:relative}.modal.wide{width:min(1080px,100%)}.close{position:absolute;right:14px;top:14px;border:0;background:var(--panel2);color:var(--muted);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}.modal h2{margin:0 0 7px;font-size:24px}.muted{color:var(--muted);line-height:1.5}.modal label{display:block;font-weight:700;margin:17px 0 0}.modal input,.modal select{display:block;width:100%;margin-top:7px;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}.modal .color{height:42px;padding:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{width:100%;justify-content:center;margin-top:18px}.error{color:var(--danger);font-size:13px}.videoList{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.videoList div{padding:9px 11px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line)}.videoList div:last-child{border-bottom:0}.videoList span{color:var(--muted);width:20px}.videoList button{margin-left:auto;border:0;background:none;color:var(--danger)}.detail{display:grid;grid-template-columns:1.7fr .8fr;gap:18px;margin-top:20px}.player{aspect-ratio:16/9;border-radius:13px;overflow:hidden;background:#000}.player iframe{width:100%;height:100%;border:0}.playerBar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:11px}.playerBar b{display:block}.playerBar small{color:var(--muted)}.trackStats{display:grid;gap:11px}.bigStat,.goal,.kv{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:15px}.bigStat{text-align:center}.bigStat svg{color:#f59e0b}.bigStat b{font-size:42px;display:block}.bigStat span{color:var(--muted)}.goal>div:first-child{display:flex;justify-content:space-between;gap:10px}.goal span,.kv span{color:var(--muted)}.goal b{font-size:13px}.goal .progress{margin:12px 0 8px}.lessonHeader{display:flex;justify-content:space-between;align-items:center;margin:24px 0 9px}.lessons{border:1px solid var(--line);border-radius:13px;overflow:hidden}.lesson{width:100%;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px;text-align:left}.lesson:last-child{border-bottom:0}.lesson:hover,.lesson.active{background:var(--panel2)}.lessonNum{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);flex:none}.lesson span:nth-child(2){flex:1}.lesson b{display:block}.lesson small{display:block;color:var(--muted);margin-top:3px}.empty{text-align:center;padding:50px;color:var(--muted)}.file{display:block;padding:13px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);margin-top:8px}.file input{margin-top:8px}.toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);z-index:20}
@media(max-width:800px){.side{width:64px;padding:16px 8px}.brand div:not(.logo),.nav span,.streakMini{display:none}.brand{margin:0 5px 30px}.nav{justify-content:center}.main{margin-left:64px;width:calc(100% - 64px);padding:24px 16px}.stats{grid-template-columns:1fr}.top h1{font-size:24px}.addBtnText{display:none}.detail{grid-template-columns:1fr}.two{grid-template-columns:1fr}.search{min-width:0;width:150px}}
</style></head><body><div id="app"></div><script src="https://www.youtube.com/iframe_api"></script><script>
const KEY='learntrack-ready-v1';
const seed={tracks:[],settings:{theme:'dark'},lastVideo:null};
let S=load(), view='dashboard', activeId=null, player=null, activeVideo=null, tick=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed}catch{return seed}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(s){s=Math.max(0,Math.round(s||0));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function vidId(u){try{let x=new URL(u);return x.hostname.includes('youtu.be')?x.pathname.slice(1):x.searchParams.get('v')}catch{return null}}
function listId(u){try{return new URL(u).searchParams.get('list')}catch{return null}}
function stats(t){let todaySec=t.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.seconds,0), totalSec=t.sessions.reduce((a,s)=>a+s.seconds,0), watched=[...new Set(t.sessions.filter(s=>s.seconds>=20).map(s=>s.videoId))];let target=t.goalType==='minutes'?t.goal*60:t.goal;let done=t.goalType==='minutes'?todaySec>=target:watchedToday(t)>=target;return{todaySec,totalSec,watched,done,target,percent:pct(totalSec,t.totalDuration||t.videos.reduce((a,v)=>a+(v.duration||0),0))}}
function watchedToday(t){return new Set(t.sessions.filter(s=>s.date===today()&&s.seconds>=20).map(s=>s.videoId)).size}
function streak(t){let dates=new Set(t.sessions.filter(s=>s.seconds>=20).map(s=>s.date));let d=new Date(),n=0;while(dates.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function icon(name){return ({home:'⌂',book:'▣',chart:'▥',settings:'⚙',sun:'☼',moon:'◐',plus:'+',flame:'♨',clock:'◷',goal:'◎',youtube:'▶',play:'▶',trash:'⌫',x:'×',check:'✓',back:'←'})[name]||''}
function render(){document.documentElement.dataset.theme=S.settings.theme||'dark';const tracks=S.tracks;let total=tracks.reduce((a,t)=>a+stats(t).todaySec,0),best=Math.max(0,...tracks.map(streak));document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">L</div><div><b>LearnTrack</b><small>study streaks</small></div></div><button class="nav active" onclick="go('dashboard')">⌂ <span>Dashboard</span></button><button class="nav" onclick="go('dashboard')">▣ <span>My tracks</span></button><button class="nav" onclick="alert('Open a track to see its analytics.')">▥ <span>Analytics</span></button><div class="sideBottom"><button class="nav" onclick="settings()">⚙ <span>Settings</span></button><div class="streakMini">♨ <b>${best}</b> day best streak</div></div></aside><main class="main">${view==='dashboard'?dashboard(tracks,total,best):trackPage(activeId)}</main></div>`}
function dashboard(tracks,total,best){return `<header class="top"><div><p class="eyebrow">PERSONAL LEARNING OS</p><h1>Keep learning. Keep the streak.</h1></div><div class="actions"><button class="icon" onclick="toggleTheme()">${S.settings.theme==='dark'?'☼':'◐'}</button><button class="primary" onclick="addTrack()">+ <span class="addBtnText">Add track</span></button></div></header><div class="stats"><div class="stat"><div class="statIcon hot">♨</div><div><span>Best current streak</span><strong>${best} days</strong></div></div><div class="stat"><div class="statIcon">◷</div><div><span>Study time today</span><strong>${fmt(total)}</strong></div></div><div class="stat"><div class="statIcon">◎</div><div><span>Goals completed today</span><strong>${tracks.filter(t=>stats(t).done).length}/${tracks.length}</strong></div></div></div><div class="sectionHead"><div><h2>Your learning tracks</h2><p>Only lessons you add here are tracked.</p></div></div><div class="grid">${tracks.map(card).join('')||`<div class="empty">No tracks yet. Add your first learning playlist.</div>`}<button class="addCard" onclick="addTrack()"><strong>＋ Add a learning track</strong><small>Import lessons and set your daily goal</small></button></div>`}
function card(t){let c=stats(t),st=streak(t);return `<button class="card" onclick="openTrack('${t.id}')"><div class="cardTop"><div class="cover" style="background:${t.color||'#7c3aed'}">▶</div><div class="title"><b>${esc(t.name)}</b><span>${t.videos.length} lessons</span></div><span class="pill">${c.done?'DONE':'ACTIVE'}</span></div><div class="progressRow"><span>${c.percent}% course progress</span><span>${c.watched.length}/${t.videos.length} watched</span></div><div class="progress"><i style="width:${c.percent}%;background:${t.color||'#7c3aed'}"></i></div><div class="bottom"><span>♨ ${st} day streak</span><span>◷ ${fmt(c.todaySec)}</span></div></button>`}
function addTrack(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><p class="eyebrow">NEW TRACK</p><h2>Create a learning track</h2><p class="muted">Add YouTube lesson URLs. A playlist URL can be imported automatically when a YouTube Data API key is configured in Settings.</p><label>Track name<input id="tname" placeholder="Machine Learning"></label><label>YouTube video URL<input id="vurl" placeholder="https://youtube.com/watch?v=…"><button class="secondary" style="margin-top:8px" onclick="addLesson()">+ Add lesson</button></label><div id="vlist" class="videoList"></div><div class="two"><label>Goal<select id="gtype"><option value="minutes">Minutes per day</option><option value="videos">Videos per day</option></select></label><label>Target<input id="goal" type="number" min="1" value="45"></label></div><label>Accent color<input id="color" class="color" type="color" value="#7c3aed"></label><p id="err" class="error"></p><button class="primary full" onclick="createTrack()">Create track</button></div></div>`);window._newVideos=[]}
function addLesson(){let u=document.getElementById('vurl').value,id=vidId(u);if(!id)return err('Enter a valid YouTube video URL.');if(window._newVideos.some(v=>v.id===id))return;window._newVideos.push({id,title:'YouTube lesson '+window._newVideos.length+1,duration:0});document.getElementById('vurl').value='';document.getElementById('vlist').innerHTML=window._newVideos.map((v,i)=>`<div>${i+1}. ${v.title}<button onclick="window._newVideos.splice(${i},1);addTrackRefresh()">×</button></div>`).join('')}
function addTrackRefresh(){let x=document.getElementById('vlist');if(x)x.innerHTML=window._newVideos.map((v,i)=>`<div>${i+1}. ${v.title}<button onclick="window._newVideos.splice(${i},1);addTrackRefresh()">×</button></div>`).join('')}
function err(x){document.getElementById('err').textContent=x}
function createTrack(){let name=document.getElementById('tname').value.trim();if(!name)return err('Give the track a name.');if(!window._newVideos.length)return err('Add at least one lesson.');let t={id:uid(),name,color:document.getElementById('color').value,goalType:document.getElementById('gtype').value,goal:Number(document.getElementById('goal').value),videos:window._newVideos.map((v,i)=>({...v,position:i+1})),sessions:[],notes:[],totalDuration:0};S.tracks.push(t);save();closeModal();openTrack(t.id)}
function openTrack(id){activeId=id;view='track';render()}
function trackPage(id){let t=S.tracks.find(x=>x.id===id);if(!t){view='dashboard';return dashboard(S.tracks,0,0)}let c=stats(t),st=streak(t),v=activeVideo&&t.videos.find(x=>x.id===activeVideo)?activeVideo:t.videos[0];return `<header class="top"><div><button class="secondary" onclick="go('dashboard')">← Back</button><p class="eyebrow" style="margin-top:18px">LEARNING TRACK</p><h1>${esc(t.name)}</h1><p class="muted">${t.videos.length} lessons · ${fmt(t.videos.reduce((a,v)=>a+(v.duration||0),0))} known duration</p></div><button class="danger" onclick="deleteTrack('${t.id}')">⌫ Delete</button></header><div class="detail"><div><div class="player" id="player"></div><div class="playerBar"><div><b>${esc((t.videos.find(x=>x.id===v?.id)||t.videos[0])?.title||'Lesson')}</b><small>Only lessons in this track are playable here.</small></div><button class="primary" onclick="startPlayer('${v?.id||t.videos[0]?.id}')">▶ Focus player</button></div></div><aside class="trackStats"><div class="bigStat">♨<b>${st}</b><span>day streak</span></div><div class="goal"><div><span>Today's goal</span><b>${t.goalType==='minutes'?`${Math.round(c.todaySec/60)} / ${t.goal} min`:`${watchedToday(t)} / ${t.goal} videos`}</b></div><div class="progress"><i style="width:${Math.min(100,t.goalType==='minutes'?c.todaySec/(t.goal*60)*100:watchedToday(t)/t.goal*100)}%;background:${t.color}"></i></div><small>${c.done?'✓ Goal completed today':'Keep going to protect your streak.'}</small></div><div class="kv"><span>Total study time</span><b>${fmt(c.totalSec)}</b></div><div class="kv"><span>Course progress</span><b>${c.percent}%</b></div></aside></div><div class="lessonHeader"><div><h2>Lessons</h2><p class="muted">Your imported learning queue.</p></div><span class="pill">${c.watched.length}/${t.videos.length} watched</span></div><div class="lessons">${t.videos.map((x,i)=>`<button class="lesson ${v&&x.id===v.id?'active':''}" onclick="selectVideo('${x.id}')"><span class="lessonNum">${c.watched.includes(x.id)?'✓':i+1}</span><span><b>${esc(x.title)}</b><small>${x.duration?fmt(x.duration):'Duration will be detected by player'}</small></span><span>›</span></button>`).join('')}</div>`}
function selectVideo(id){activeVideo=id;render();setTimeout(()=>startPlayer(id),50)}
function startPlayer(id){activeVideo=id;let el=document.getElementById('player');if(!el)return; if(player){try{player.destroy()}catch{}} player=new YT.Player('player',{videoId:id,playerVars:{rel:0,modestbranding:1,playsinline:1},events:{onReady:e=>{let t=S.tracks.find(x=>x.id===activeId),v=t.videos.find(x=>x.id===id);if(v&&!v.duration){v.duration=Math.round(e.target.getDuration());t.totalDuration=t.videos.reduce((a,x)=>a+(x.duration||0),0);save();render();setTimeout(()=>startPlayer(id),50)}},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING)beginTick();else endTick()}}})}
function beginTick(){endTick();tick=setInterval(()=>{if(document.visibilityState!=='visible'||!player?.getPlayerState||player.getPlayerState()!==1)return;let t=S.tracks.find(x=>x.id===activeId),id=activeVideo||t?.videos[0]?.id;if(!t||!id)return;let now=Date.now();let last=t._lastTick||now;t._lastTick=now;let delta=Math.min(8,(now-last)/1000);if(delta>0&&delta<9){let s=t.sessions.find(x=>x.date===today()&&x.videoId===id);if(!s){s={id:uid(),date:today(),videoId:id,seconds:0,createdAt:new Date().toISOString()};t.sessions.push(s)}s.seconds+=delta;save();renderProgressOnly(t)}},5000)}
function endTick(){if(tick)clearInterval(tick);tick=null}
function renderProgressOnly(t){let el=document.querySelector('.goal');if(!el)return;let c=stats(t);el.querySelector('b').textContent=t.goalType==='minutes'?`${Math.round(c.todaySec/60)} / ${t.goal} min`:`${watchedToday(t)} / ${t.goal} videos`;el.querySelector('.progress i').style.width=Math.min(100,t.goalType==='minutes'?c.todaySec/(t.goal*60)*100:watchedToday(t)/t.goal*100)+'%';el.querySelector('small').textContent=c.done?'✓ Goal completed today':'Keep going to protect your streak.'}
function deleteTrack(id){if(confirm('Delete this track and all watch history?')){S.tracks=S.tracks.filter(t=>t.id!==id);save();go('dashboard')}}
function settings(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><p class="eyebrow">SETTINGS</p><h2>LearnTrack settings</h2><label>Theme<select id="themeSel" onchange="S.settings.theme=this.value;save();render()"><option value="dark" ${S.settings.theme==='dark'?'selected':''}>Dark</option><option value="light" ${S.settings.theme==='light'?'selected':''}>Light</option></select></label><label>Optional YouTube Data API key<input id="ytkey" value="${esc(localStorage.getItem('learntrack-yt-key')||'')}" placeholder="AIza…"></label><button class="secondary full" onclick="localStorage.setItem('learntrack-yt-key',document.getElementById('ytkey').value);alert('YouTube key saved on this device.')">Save API key</button><button class="secondary full" onclick="exportData()">Export backup</button><label class="file">Import backup<input type="file" accept="application/json" onchange="importData(event)"></label><button class="danger full" onclick="if(confirm('Reset all data?')){S=JSON.parse(JSON.stringify(seed));save();closeModal();render()}">Reset all data</button><p class="muted">For multi-device use, deploy this app and add a cloud database/auth layer. Browser storage is device-specific by design.</p></div></div>`)}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='learntrack-backup.json';a.click()}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();closeModal();render()}catch{alert('Invalid backup')}};r.readAsText(f)}
function closeModal(){document.getElementById('modal')?.remove()}
function toggleTheme(){S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();render()}
function go(v){endTick();view=v;activeVideo=null;render()}
window.onbeforeunload=endTick;document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')endTick()});
window.onYouTubeIframeAPIReady=()=>{};render();
</script></body></html>
